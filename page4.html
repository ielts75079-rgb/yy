<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Letter For You</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 200px;
      background-color: #f0e6d2;
      margin: 120px auto 40px auto;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* Top Flap of Envelope */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 110px solid #e2d4b7;
      transform-origin: top;
      transition: transform 0.8s ease-in-out;
      z-index: 4;
    }

    /* Wax Stamp Seal holding flap closed */
    .stamp-seal {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 55px;
      background-color: #ff4757;
      border: 3px dashed #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      z-index: 5;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    /* Envelope Pocket (Front Cover) */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid #ebd9b5;
      border-right: 160px solid #ebd9b5;
      border-bottom: 100px solid #dfcb9e;
      border-radius: 0 0 10px 10px;
      z-index: 3;
    }

    /* The Secret Message Paper */
    .message-paper {
      position: absolute;
      bottom: 10px;
      left: 20px;
      width: 280px;
      background: #ffffff;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
      z-index: 2;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
    }

    .message-paper h3 {
      color: #ff4757;
      margin-bottom: 8px;
    }

    .message-paper p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #2d3436;
    }

    /* Animation States triggered after 5 seconds */
    .envelope-wrapper.open .stamp-seal {
      opacity: 0;
      transform: translateX(-50%) scale(1.5);
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.open .message-paper {
      opacity: 1;
      visibility: visible;
      transform: translateY(-160px);
      z-index: 4;
    }

    /* Fullscreen NO Button Style */
    .quiz-btn.fullscreen-no {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      border-radius: 0 !important;
      z-index: 99999 !important;
      font-size: 3rem !important;
      font-weight: bold !important;
      background-color: #55efc4 !important;
      color: #2d3436 !important;
      box-shadow: none !important;
      transform: none !important;
    }
  </style>
</head>
<body>

  <!-- Envelope with Stamp Seal -->
  <div class="envelope-wrapper" id="envelope">
    
    <!-- Top Flap & Stamp Seal -->
    <div class="envelope-flap">
      <div class="stamp-seal">💌</div>
    </div>

    <!-- Inside Message Paper -->
    <div class="message-paper">
      <h3>Dear Bestie,</h3>
      <p>Thank you for being the most amazing friend in the world. Life is so much brighter and funnier with you in it! 💖</p>
    </div>

    <!-- Front Envelope Cover -->
    <div class="envelope-pocket"></div>
  </div>

  <!-- Funny Quiz Section -->
  <div class="quiz-section" style="margin-top: 140px; margin-bottom: 50px;">
    <h3 id="quizTitle">Do you hate me? 👀</h3>
    <div class="btn-group">
      <button class="quiz-btn" id="yesBtn">Yes</button>
      <button class="quiz-btn" id="noBtn">No</button>
    </div>
    <h2 id="finalMessage" style="margin-top:30px; color:#ff4757; display:none; font-size: 1.8rem;"></h2>
  </div>

  <script>
    const envelope = document.getElementById('envelope');

    // Open envelope seal after 5 seconds
    setTimeout(() => {
      envelope.classList.add('open');
    }, 5000);

    // Playful Quiz Logic
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const quizTitle = document.getElementById('quizTitle');
    const finalMessage = document.getElementById('finalMessage');
    
    let moveCount = 0;

    yesBtn.addEventListener('mouseover', moveYesButton);
    yesBtn.addEventListener('click', moveYesButton);

    function moveYesButton() {
      if (moveCount < 6) { // Dodges 6 times
        const x = Math.random() * (window.innerWidth - 100) - (window.innerWidth / 2 - 50);
        const y = Math.random() * 100 - 50;
        yesBtn.style.transform = `translate(${x}px, ${y}px)`;
        moveCount++;
      } else {
        // On 7th trigger: Yes disappears, NO takes over the whole screen
        yesBtn.style.display = 'none';
        noBtn.classList.add('fullscreen-no');
        noBtn.innerText = "NO! (Click Me)";
      }
    }

    noBtn.addEventListener('click', () => {
      yesBtn.style.display = 'none';
      noBtn.style.display = 'none';
      noBtn.classList.remove('fullscreen-no'); // Removes screen overlay so letter remains visible
      quizTitle.style.display = 'none';
      
      // Keeps the envelope visible and displays the final prank text right underneath it
      finalMessage.innerText = "pucchu pucchu i know u love me send me a bucket of pepsi now 🥤💖";
      finalMessage.style.display = 'block';
    });
  </script>
</body>
</html>
