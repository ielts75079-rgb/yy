<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Lane - Page 5</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-content {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .timeline {
      position: relative;
      margin: 30px 0;
      padding-left: 20px;
      border-left: 3px dashed #ff6b81;
      text-align: left;
    }
    .timeline-item {
      margin-bottom: 20px;
      position: relative;
    }
    .timeline-item::before {
      content: '💖';
      position: absolute;
      left: -29px;
      top: 0;
      background: #fff;
      font-size: 0.9rem;
    }
    .timeline-item h3 {
      color: #ff4757;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .timeline-item p {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="transition-overlay" id="overlay"></div>

  <div class="page-content">
    <h2>Our Friendship Timeline ✨</h2>
    <div class="timeline">
      <div class="timeline-item">
        <h3>The Accidental Meeting</h3>
        <p>Who knew we'd end up being absolute inseparable idiots together?</p>
      </div>
      <div class="timeline-item">
        <h3>Late Night Talks</h3>
        <p>Sharing random reels, weird secrets, and laughing till our stomachs hurt.</p>
      </div>
      <div class="timeline-item">
        <h3>Today & Forever</h3>
        <p>Surviving life's chaos one funny memory at a time!</p>
      </div>
    </div>

    <button class="nav-btn" onclick="navigateTo('page6.html')">Next Adventure 🚀</button>
  </div>

  <script>
    function navigateTo(url) {
      document.getElementById('overlay').classList.add('active');
      setTimeout(() => { window.location.href = url; }, 800);
    }
  </script>
</body>
</html>
